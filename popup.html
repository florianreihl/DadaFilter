<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DadaFilter</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <h1>DadaFilter</h1>

    <label for="filterLevel">Filter level</label>

    <select id="filterLevel">
        <option value="off">Off</option>
        <option value="strict">Strict</option>
        <option value="soft">Soft</option>
        <option value="collapsed">Collapsed</option>
    </select>

    <label for="wordInput">Blacklisted words</label>

    <div id="wordInputRow">
        <input type="text" id="wordInput" placeholder="Add a word...">
        <button id="addWordButton">Add</button>
    </div>

    <ul id="wordList"></ul>

    <script src="blacklistedWords.js"></script>
    <script src="popup.js"></script>

</body>
</html>
